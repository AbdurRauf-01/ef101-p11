{% extends "base.html" %}
{% block title %}Edit history entry{% endblock %}
{% block content %}
<h1>Edit history entry · {{ asset_id }}</h1>
<p class="muted">Correct the wording, date, category or cost. The entry stays in the same place in the history.</p>
<div class="card">
<form method="post" novalidate>
<div class="formgrid">
  <div><label>Date *</label><input type="date" name="event_date" value="{{ a.get('event_date','') }}"></div>
  <div><label>Fault category *</label><select name="fault_category">
    {% for o in fault_categories %}{% if o != 'Unknown' %}<option{{ ' selected' if a.get('fault_category')==o }}>{{ o }}</option>{% endif %}{% endfor %}</select></div>
  <div><label>Fault description *</label><input name="fault_description" value="{{ a.get('fault_description','') or '' }}"></div>
  <div><label>Action taken *</label><input name="action_taken" value="{{ a.get('action_taken','') or '' }}"></div>
  <div><label>Technician *</label><input name="technician" value="{{ a.get('technician','') or '' }}"></div>
  <div><label>Updated Cost ($)</label><input name="cost" value="{{ a.get('cost', a.get('cost_usd', 0)) }}"></div>
</div>
<p class="row" style="margin-top:16px"><button class="btn" type="submit">Save</button>
<a class="btn sec" href="{{ url_for('asset_detail', asset_id=asset_id) }}">Cancel</a></p>
</form></div>
{% endblock %}
