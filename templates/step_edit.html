{% extends "base.html" %}
{% block title %}Edit Step #{{ s.id }}{% endblock %}
{% block content %}
<div class="row" style="justify-content:space-between">
  <h1>Edit Step #{{ s.id }} ({{ s.asset_id }})</h1>
  <a class="btn sec" href="{{ url_for('asset_detail', asset_id=s.asset_id) }}">Back to Asset</a>
</div>

<div class="card">
<form method="post" novalidate>
<div class="formgrid">
  <div><label for="f-step_date">Step Date * (YYYY-MM-DD)</label><input type="date" name="step_date" value="{{ s.get('step_date', '') }}" id="f-step_date"></div>
  <div><label for="f-action">Action taken</label><input name="action" value="{{ s.get('action', '') }}" placeholder="Action description" id="f-action"></div>
  <div><label for="f-technician">Technician</label><input name="technician" value="{{ s.get('technician', '') }}" placeholder="Technician name" id="f-technician"></div>
</div>
<p class="row" style="margin-top:16px">
  <button class="btn" type="submit">Save Changes</button>
  <a class="btn sec" href="{{ url_for('asset_detail', asset_id=s.asset_id) }}">Cancel</a>
</p>
</form>
</div>
{% endblock %}
