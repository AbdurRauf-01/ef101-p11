{% extends "base.html" %}
{% block title %}Edit step{% endblock %}
{% block content %}
<h1>Edit step · {{ asset_id }}</h1>
<p class="muted">Correct the wording, date or technician of this step of the open fault.</p>
<div class="card">
<form method="post" novalidate>
<div class="formgrid">
  <div><label>Date *</label><input type="date" name="step_date" value="{{ a.get('step_date','') }}"></div>
  <div><label>Action *</label><input name="action" value="{{ a.get('action','') or '' }}"></div>
  <div><label>Technician</label><input name="technician" value="{{ a.get('technician','') or '' }}"></div>
</div>
<p class="row" style="margin-top:16px"><button class="btn" type="submit">Save</button>
<a class="btn sec" href="{{ url_for('asset_detail', asset_id=asset_id) }}">Cancel</a></p>
</form></div>
{% endblock %}
