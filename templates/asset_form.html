{% extends "base.html" %}
{% block title %}{{ 'Add' if new else 'Edit' }} asset{% endblock %}
{% block content %}
<h1>{{ 'Add asset' if new else 'Edit ' ~ a.asset_id }}</h1>
<div class="card">
<form method="post" novalidate>
<div class="formgrid">
  <div><label>Location *</label>
    <select name="location" id="loc-select" style="{{ 'display:none' if a.get('location')==NEW_LOCATION }}">
      <option value="">— choose —</option>
      {% for o in locations %}<option{{ ' selected' if a.get('location')==o }}>{{ o }}</option>{% endfor %}
      <option value="{{ NEW_LOCATION }}"{{ ' selected' if a.get('location')==NEW_LOCATION }}>+ Add new location…</option>
    </select>
    <input name="new_location" id="loc-new" value="{{ a.get('new_location','') or '' }}"
           placeholder="Type the new location (Esc = back to list)" style="{{ '' if a.get('location')==NEW_LOCATION else 'display:none' }}"></div>
  <div><label>Asset ID {{ '(blank = automatic)' if new else '(permanent)' }}</label>
    <input name="asset_id" value="{{ a.get('asset_id','') or '' }}" {{ '' if new else 'readonly' }} placeholder="auto, e.g. L1-PC-041"></div>
  <div><label>Manufacturer *</label><input name="manufacturer" value="{{ a.get('manufacturer','') }}"></div>
  <div><label>Model *</label><input name="model" value="{{ a.get('model','') }}"></div>
  <div><label>CPU (full model) *</label><input name="cpu" value="{{ a.get('cpu','') }}" placeholder="Intel Core i5-12400"></div>
  <div><label>CPU family *</label><input name="cpu_family" value="{{ a.get('cpu_family','') }}" placeholder="Core i5"></div>
  <div><label>RAM (GB) *</label><input name="ram_gb" value="{{ a.get('ram_gb','') }}"></div>
  <div><label>RAM type *</label><select name="ram_type"><option value="">— choose —</option>
    {% for o in ram_types %}<option{{ ' selected' if a.get('ram_type')==o }}>{{ o }}</option>{% endfor %}</select></div>
  <div><label>Storage type *</label><select name="storage_type">
    {% for o in storage_types %}<option{{ ' selected' if a.get('storage_type')==o }}>{{ o }}</option>{% endfor %}</select></div>
  <div><label>Storage capacity (GB) *</label><input name="storage_gb" value="{{ a.get('storage_gb','') }}"></div>
  <div><label>GPU (blank = integrated)</label><input name="gpu" value="{{ a.get('gpu','') or '' }}" placeholder="NVIDIA RTX 3060"></div>
  <div><label>GPU VRAM (GB), if a GPU is listed</label><input name="gpu_vram_gb" value="{{ a.get('gpu_vram_gb','') or '' }}" placeholder="12"></div>
  <div><label>Operating system *</label><input name="os" value="{{ a.get('os','') }}"></div>
  <div><label>IP address (blank = automatic)</label><input name="ip_address" value="{{ a.get('ip_address','') or '' }}" placeholder="auto, e.g. 192.168.1.4"></div>
  <div><label>Purchase date * (YYYY-MM-DD)</label><input type="date" name="purchase_date" value="{{ a.get('purchase_date','') }}"></div>
  <div><label>Warranty expiry * (YYYY-MM-DD)</label><input type="date" name="warranty_expiry" value="{{ a.get('warranty_expiry','') }}"></div>
  <div><label>Operational status</label><select name="status">
    {% for o in statuses %}<option{{ ' selected' if a.get('status')==o }}>{{ o }}</option>{% endfor %}</select></div>
  <div><label>Current error category (Faulty / Under Repair)</label><select name="status_category"><option value="">— choose —</option>
    {% for o in error_categories %}<option{{ ' selected' if a.get('status_category')==o }}>{{ o }}</option>{% endfor %}</select></div>
  <div><label>Current error details (Faulty / Under Repair)</label><input name="status_detail" value="{{ a.get('status_detail','') or '' }}" placeholder="Describe the fault, or Unknown"></div>
</div>
<p class="row" style="margin-top:16px"><button class="btn" type="submit">Save</button>
<a class="btn sec" href="{{ url_for('assets') }}">Cancel</a></p>
</form>
</div>
<script>
// "+ Add new location" turns the same box into a text field; Esc or an empty field goes back to the list.
(function () {
  var NEW = "{{ NEW_LOCATION }}";
  var sel = document.getElementById('loc-select'), inp = document.getElementById('loc-new');
  function toNew() { sel.style.display = 'none'; inp.style.display = ''; inp.focus(); }
  function toList() { inp.style.display = 'none'; inp.value = ''; sel.style.display = ''; sel.value = ''; }
  sel.addEventListener('change', function () { if (sel.value === NEW) toNew(); });
  inp.addEventListener('blur', function () { if (!inp.value.trim()) toList(); });
  inp.addEventListener('keydown', function (e) { if (e.key === 'Escape') toList(); });
})();
</script>
{% endblock %}
