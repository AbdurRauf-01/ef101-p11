<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Hardware Inventory{% endblock %} - EF101-P11</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav>
  <span class="brand">Hardware Inventory</span>
  <a href="{{ url_for('dashboard') }}">Dashboard</a>
  <a href="{{ url_for('assets') }}">Assets</a>
  <a href="{{ url_for('asset_new') }}">Add asset</a>
  <a href="{{ url_for('export_assets') }}">Export assets</a>
  <a href="{{ url_for('export_maintenance') }}">Export maintenance</a>
</nav>
<main>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
